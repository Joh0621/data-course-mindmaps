<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="2483" viewBox="0 0 2220 2483"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="70" y="45" font-size="18" fill="#86939A" dominant-baseline="middle">2026.10.28  /  课堂知识整理</text><text x="70" y="80" font-size="28" fill="#344048" dominant-baseline="middle">简单数据的整理方法 · 课程详图</text><path d="M 350 1188.0 C 445 1188.0, 370 255.0, 470 255.0" fill="none" stroke="#E58A32" stroke-width="8" stroke-linecap="round"/><rect x="470" y="227.0" width="237" height="56" rx="13" fill="white" stroke="#E58A32" stroke-width="2"/><text x="485" y="255.0" font-size="23" fill="#344048" dominant-baseline="middle">直方图：概念与用途</text><path d="M 707 255.0 C 802 255.0, 750 183.0, 850 183.0" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="865" y="183.0" font-size="22" fill="#344048" dominant-baseline="middle">看分布</text><path d="M 946 183.0 C 1041 183.0, 1150 135, 1250 135" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="135" font-size="22" fill="#344048" dominant-baseline="middle">横轴是连续数值区间；矩形相邻无间隙</text><path d="M 946 183.0 C 1041 183.0, 1150 183, 1250 183" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="183" font-size="22" fill="#344048" dominant-baseline="middle">显示质量波动，帮助判断过程状况</text><path d="M 946 183.0 C 1041 183.0, 1150 231, 1250 231" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="231" font-size="22" fill="#344048" dominant-baseline="middle">寻找质量改进的重点</text><path d="M 707 255.0 C 802 255.0, 750 327.0, 850 327.0" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="865" y="327.0" font-size="22" fill="#344048" dominant-baseline="middle">与柱状图区分</text><path d="M 1012 327.0 C 1107 327.0, 1150 279, 1250 279" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="279" font-size="22" fill="#344048" dominant-baseline="middle">柱状图：比较类别，柱间有空隙</text><path d="M 1012 327.0 C 1107 327.0, 1150 327, 1250 327" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="327" font-size="22" fill="#344048" dominant-baseline="middle">直方图：表示连续区间分布，面积反映频数</text><path d="M 1012 327.0 C 1107 327.0, 1150 375, 1250 375" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="375" font-size="22" fill="#344048" dominant-baseline="middle">等组距时高度可表示频数；不等组距用密度</text><path d="M 350 1188.0 C 445 1188.0, 370 633.0, 470 633.0" fill="none" stroke="#168798" stroke-width="8" stroke-linecap="round"/><rect x="470" y="605.0" width="168" height="56" rx="13" fill="white" stroke="#168798" stroke-width="2"/><text x="485" y="633.0" font-size="23" fill="#344048" dominant-baseline="middle">直方图：绘制</text><path d="M 638 633.0 C 733 633.0, 750 513.0, 850 513.0" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="865" y="513.0" font-size="22" fill="#344048" dominant-baseline="middle">准备与分组</text><path d="M 990 513.0 C 1085 513.0, 1150 465, 1250 465" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="465" font-size="22" fill="#344048" dominant-baseline="middle">准备数据、计算极差 R＝最大值－最小值【补充】</text><path d="M 990 513.0 C 1085 513.0, 1150 513, 1250 513" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="513" font-size="22" fill="#344048" dominant-baseline="middle">确定组数 K；组距 h＝R÷K，宜取整</text><path d="M 990 513.0 C 1085 513.0, 1150 561, 1250 561" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="561" font-size="22" fill="#344048" dominant-baseline="middle">确定组界与组中值</text><path d="M 638 633.0 C 733 633.0, 750 633.0, 850 633.0" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="865" y="633.0" font-size="22" fill="#344048" dominant-baseline="middle">组数参考（课件）</text><path d="M 1056 633.0 C 1151 633.0, 1150 609, 1250 609" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="609" font-size="22" fill="#344048" dominant-baseline="middle">N＜50：5～7组；50～100：6～10组</text><path d="M 1056 633.0 C 1151 633.0, 1150 657, 1250 657" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="657" font-size="22" fill="#344048" dominant-baseline="middle">100～250：7～12组；250以上：10～20组</text><path d="M 638 633.0 C 733 633.0, 750 753.0, 850 753.0" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="865" y="753.0" font-size="22" fill="#344048" dominant-baseline="middle">统计与绘图</text><path d="M 990 753.0 C 1085 753.0, 1150 705, 1250 705" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="705" font-size="22" fill="#344048" dominant-baseline="middle">统计各组频数，检查总数等于样本量</text><path d="M 990 753.0 C 1085 753.0, 1150 753, 1250 753" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="753" font-size="22" fill="#344048" dominant-baseline="middle">按需要计算频率或频率密度</text><path d="M 990 753.0 C 1085 753.0, 1150 801, 1250 801" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="801" font-size="22" fill="#344048" dominant-baseline="middle">绘制相邻矩形，观察形态与异常</text><path d="M 350 1188.0 C 445 1188.0, 370 963.0, 470 963.0" fill="none" stroke="#E7B52D" stroke-width="8" stroke-linecap="round"/><rect x="470" y="935.0" width="214" height="56" rx="13" fill="white" stroke="#E7B52D" stroke-width="2"/><text x="485" y="963.0" font-size="23" fill="#344048" dominant-baseline="middle">直方图：形态判断</text><path d="M 684 963.0 C 779 963.0, 750 891.0, 850 891.0" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="865" y="891.0" font-size="22" fill="#344048" dominant-baseline="middle">正常型</text><path d="M 946 891.0 C 1041 891.0, 1150 891, 1250 891" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="891" font-size="22" fill="#344048" dominant-baseline="middle">中间高、两侧低、左右近似对称（课件语境）</text><path d="M 684 963.0 C 779 963.0, 750 1035.0, 850 1035.0" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="865" y="1035.0" font-size="22" fill="#344048" dominant-baseline="middle">异常形态与排查线索</text><path d="M 1078 1035.0 C 1173 1035.0, 1150 939, 1250 939" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="939" font-size="22" fill="#344048" dominant-baseline="middle">折齿型：分组或组距不当</text><path d="M 1078 1035.0 C 1173 1035.0, 1150 987, 1250 987" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="987" font-size="22" fill="#344048" dominant-baseline="middle">缓坡型：课件提示上限或下限控制过严</text><path d="M 1078 1035.0 C 1173 1035.0, 1150 1035, 1250 1035" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1035" font-size="22" fill="#344048" dominant-baseline="middle">孤岛型：混入少量其他分布或测量错误</text><path d="M 1078 1035.0 C 1173 1035.0, 1150 1083, 1250 1083" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1083" font-size="22" fill="#344048" dominant-baseline="middle">双峰型：混合两种均值差异较大的分布</text><path d="M 1078 1035.0 C 1173 1035.0, 1150 1131, 1250 1131" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1131" font-size="22" fill="#344048" dominant-baseline="middle">绝壁型：课件提示可能剔除了不合格数据</text><path d="M 350 1188.0 C 445 1188.0, 370 1257.0, 470 1257.0" fill="none" stroke="#88B64E" stroke-width="8" stroke-linecap="round"/><rect x="470" y="1229.0" width="145" height="56" rx="13" fill="white" stroke="#88B64E" stroke-width="2"/><text x="485" y="1257.0" font-size="23" fill="#344048" dominant-baseline="middle">分组整理法</text><path d="M 615 1257.0 C 710 1257.0, 750 1221.0, 850 1221.0" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="865" y="1221.0" font-size="22" fill="#344048" dominant-baseline="middle">概念</text><path d="M 924 1221.0 C 1019 1221.0, 1150 1221, 1250 1221" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1221" font-size="22" fill="#344048" dominant-baseline="middle">依据研究目的与现象特点，把总体分为不同性质的组</text><path d="M 615 1257.0 C 710 1257.0, 750 1293.0, 850 1293.0" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="865" y="1293.0" font-size="22" fill="#344048" dominant-baseline="middle">两项关键</text><path d="M 968 1293.0 C 1063 1293.0, 1150 1269, 1250 1269" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1269" font-size="22" fill="#344048" dominant-baseline="middle">选择分组标志：确定分类标准与依据</text><path d="M 968 1293.0 C 1063 1293.0, 1150 1317, 1250 1317" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1317" font-size="22" fill="#344048" dominant-baseline="middle">划分各组界限：明确性质与数量边界</text><path d="M 350 1188.0 C 445 1188.0, 370 1587.0, 470 1587.0" fill="none" stroke="#DA736C" stroke-width="8" stroke-linecap="round"/><rect x="470" y="1559.0" width="237" height="56" rx="13" fill="white" stroke="#DA736C" stroke-width="2"/><text x="485" y="1587.0" font-size="23" fill="#344048" dominant-baseline="middle">层别法：分类与对象</text><path d="M 707 1587.0 C 802 1587.0, 750 1431.0, 850 1431.0" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="865" y="1431.0" font-size="22" fill="#344048" dominant-baseline="middle">核心思路</text><path d="M 968 1431.0 C 1063 1431.0, 1150 1407, 1250 1407" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1407" font-size="22" fill="#344048" dominant-baseline="middle">按来源和共同特征分类，再分别统计分析</text><path d="M 968 1431.0 C 1063 1431.0, 1150 1455, 1250 1455" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1455" font-size="22" fill="#344048" dominant-baseline="middle">区分不同原因对结果的影响</text><path d="M 707 1587.0 C 802 1587.0, 750 1551.0, 850 1551.0" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="865" y="1551.0" font-size="22" fill="#344048" dominant-baseline="middle">常见层别维度</text><path d="M 1012 1551.0 C 1107 1551.0, 1150 1503, 1250 1503" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1503" font-size="22" fill="#344048" dominant-baseline="middle">部门、过程区域、操作员、设备</text><path d="M 1012 1551.0 C 1107 1551.0, 1150 1551, 1250 1551" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1551" font-size="22" fill="#344048" dominant-baseline="middle">作业条件、时间、原材料、环境、地区、制品</text><path d="M 1012 1551.0 C 1107 1551.0, 1150 1599, 1250 1599" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1599" font-size="22" fill="#344048" dominant-baseline="middle">测量与检查可按人、机、物、法、环细分</text><path d="M 707 1587.0 C 802 1587.0, 750 1743.0, 850 1743.0" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="865" y="1743.0" font-size="22" fill="#344048" dominant-baseline="middle">人・机・物・法・环</text><path d="M 1078 1743.0 C 1173 1743.0, 1150 1647, 1250 1647" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1647" font-size="22" fill="#344048" dominant-baseline="middle">人：技术水平、身体状况、责任心</text><path d="M 1078 1743.0 C 1173 1743.0, 1150 1695, 1250 1695" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1695" font-size="22" fill="#344048" dominant-baseline="middle">机：工具磨损、设备精度</text><path d="M 1078 1743.0 C 1173 1743.0, 1150 1743, 1250 1743" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1743" font-size="22" fill="#344048" dominant-baseline="middle">物：原材料质量</text><path d="M 1078 1743.0 C 1173 1743.0, 1150 1791, 1250 1791" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1791" font-size="22" fill="#344048" dominant-baseline="middle">法：操作方式、速度、程序、次序</text><path d="M 1078 1743.0 C 1173 1743.0, 1150 1839, 1250 1839" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1839" font-size="22" fill="#344048" dominant-baseline="middle">环：照明、噪声、振动、温度</text><path d="M 350 1188.0 C 445 1188.0, 370 2121.0, 470 2121.0" fill="none" stroke="#8470B5" stroke-width="8" stroke-linecap="round"/><rect x="470" y="2093.0" width="237" height="56" rx="13" fill="white" stroke="#8470B5" stroke-width="2"/><text x="485" y="2121.0" font-size="23" fill="#344048" dominant-baseline="middle">层别法：使用与价值</text><path d="M 707 2121.0 C 802 2121.0, 750 1977.0, 850 1977.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="1977.0" font-size="22" fill="#344048" dominant-baseline="middle">使用步骤</text><path d="M 968 1977.0 C 1063 1977.0, 1150 1929, 1250 1929" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1929" font-size="22" fill="#344048" dominant-baseline="middle">明确主题或范围</text><path d="M 968 1977.0 C 1063 1977.0, 1150 1977, 1250 1977" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1977" font-size="22" fill="#344048" dominant-baseline="middle">确定分类项目及隶属关系</text><path d="M 968 1977.0 C 1063 1977.0, 1150 2025, 1250 2025" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2025" font-size="22" fill="#344048" dominant-baseline="middle">逐层展开，分类统计并比较</text><path d="M 707 2121.0 C 802 2121.0, 750 2121.0, 850 2121.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="2121.0" font-size="22" fill="#344048" dominant-baseline="middle">注意事项</text><path d="M 968 2121.0 C 1063 2121.0, 1150 2073, 1250 2073" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2073" font-size="22" fill="#344048" dominant-baseline="middle">收集数据前就设计层别</text><path d="M 968 2121.0 C 1063 2121.0, 1150 2121, 1250 2121" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2121" font-size="22" fill="#344048" dominant-baseline="middle">可单独使用，也可结合其他整理方法</text><path d="M 968 2121.0 C 1063 2121.0, 1150 2169, 1250 2169" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2169" font-size="22" fill="#344048" dominant-baseline="middle">各层界限明确，层别对象具有可比性</text><path d="M 707 2121.0 C 802 2121.0, 750 2265.0, 850 2265.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="2265.0" font-size="22" fill="#344048" dominant-baseline="middle">价值与案例</text><path d="M 990 2265.0 C 1085 2265.0, 1150 2217, 1250 2217" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2217" font-size="22" fill="#344048" dominant-baseline="middle">条件变化时快速定位变动来源</text><path d="M 990 2265.0 C 1085 2265.0, 1150 2265, 1250 2265" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2265" font-size="22" fill="#344048" dominant-baseline="middle">掌握变动因子，获取有效信息</text><path d="M 990 2265.0 C 1085 2265.0, 1150 2313, 1250 2313" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2313" font-size="22" fill="#344048" dominant-baseline="middle">案例：按操作者与气缸垫来源分析漏油情况</text><rect x="70" y="1150.0" width="280" height="76" rx="16" fill="#50B98C"/><text x="95" y="1188.0" font-size="30" fill="white" dominant-baseline="middle">简单数据整理</text><text x="70" y="2448" font-size="17" fill="#88959A" dominant-baseline="middle">依据课程截图整理，重复内容已合并；标注“补充”的内容用于澄清概念。</text></g></svg>