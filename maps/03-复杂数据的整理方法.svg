<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="2483" viewBox="0 0 2220 2483"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="70" y="45" font-size="18" fill="#86939A" dominant-baseline="middle">2026.10.28  /  课堂知识整理</text><text x="70" y="80" font-size="28" fill="#344048" dominant-baseline="middle">复杂数据的整理方法 · 课程详图</text><path d="M 350 1212.0 C 445 1212.0, 370 231.0, 470 231.0" fill="none" stroke="#E58A32" stroke-width="8" stroke-linecap="round"/><rect x="470" y="203.0" width="237" height="56" rx="13" fill="white" stroke="#E58A32" stroke-width="2"/><text x="485" y="231.0" font-size="23" fill="#344048" dominant-baseline="middle">相关分析：关系类型</text><path d="M 707 231.0 C 802 231.0, 750 159.0, 850 159.0" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="865" y="159.0" font-size="22" fill="#344048" dominant-baseline="middle">基本概念</text><path d="M 968 159.0 C 1063 159.0, 1150 135, 1250 135" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="135" font-size="22" fill="#344048" dominant-baseline="middle">函数关系：确定性关系</text><path d="M 968 159.0 C 1063 159.0, 1150 183, 1250 183" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="183" font-size="22" fill="#344048" dominant-baseline="middle">相关关系：非确定性的相互依存关系</text><path d="M 707 231.0 C 802 231.0, 750 303.0, 850 303.0" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="865" y="303.0" font-size="22" fill="#344048" dominant-baseline="middle">分类维度</text><path d="M 968 303.0 C 1063 303.0, 1150 231, 1250 231" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="231" font-size="22" fill="#344048" dominant-baseline="middle">因素数量：单相关、复相关</text><path d="M 968 303.0 C 1063 303.0, 1150 279, 1250 279" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="279" font-size="22" fill="#344048" dominant-baseline="middle">变化方向：正相关、负相关</text><path d="M 968 303.0 C 1063 303.0, 1150 327, 1250 327" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="327" font-size="22" fill="#344048" dominant-baseline="middle">相关程度：完全相关、不完全相关、不相关</text><path d="M 968 303.0 C 1063 303.0, 1150 375, 1250 375" fill="none" stroke="#E58A32" stroke-width="2" stroke-linecap="round"/><text x="1265" y="375" font-size="22" fill="#344048" dominant-baseline="middle">图形：正线性、负线性、曲线、不相关</text><path d="M 350 1212.0 C 445 1212.0, 370 549.0, 470 549.0" fill="none" stroke="#168798" stroke-width="8" stroke-linecap="round"/><rect x="470" y="521.0" width="283" height="56" rx="13" fill="white" stroke="#168798" stroke-width="2"/><text x="485" y="549.0" font-size="23" fill="#344048" dominant-baseline="middle">相关分析：相关系数 r</text><path d="M 753 549.0 C 848 549.0, 750 489.0, 850 489.0" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="865" y="489.0" font-size="22" fill="#344048" dominant-baseline="middle">取值与方向</text><path d="M 990 489.0 C 1085 489.0, 1150 465, 1250 465" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="465" font-size="22" fill="#344048" dominant-baseline="middle">−1 ≤ r ≤ 1</text><path d="M 990 489.0 C 1085 489.0, 1150 513, 1250 513" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="513" font-size="22" fill="#344048" dominant-baseline="middle">r＞0 为正相关；r＜0 为负相关</text><path d="M 753 549.0 C 848 549.0, 750 609.0, 850 609.0" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="865" y="609.0" font-size="22" fill="#344048" dominant-baseline="middle">强弱判断</text><path d="M 968 609.0 C 1063 609.0, 1150 561, 1250 561" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="561" font-size="22" fill="#344048" dominant-baseline="middle">|r| 越接近1，线性关系越强</text><path d="M 968 609.0 C 1063 609.0, 1150 609, 1250 609" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="609" font-size="22" fill="#344048" dominant-baseline="middle">|r|＝1：完全线性相关</text><path d="M 968 609.0 C 1063 609.0, 1150 657, 1250 657" fill="none" stroke="#168798" stroke-width="2" stroke-linecap="round"/><text x="1265" y="657" font-size="22" fill="#344048" dominant-baseline="middle">r＝0：无线性相关，仍可能有非线性关系</text><path d="M 350 1212.0 C 445 1212.0, 370 927.0, 470 927.0" fill="none" stroke="#E7B52D" stroke-width="8" stroke-linecap="round"/><rect x="470" y="899.0" width="306" height="56" rx="13" fill="white" stroke="#E7B52D" stroke-width="2"/><text x="485" y="927.0" font-size="23" fill="#344048" dominant-baseline="middle">相关分析：Excel案例</text><path d="M 776 927.0 C 871 927.0, 750 843.0, 850 843.0" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="865" y="843.0" font-size="22" fill="#344048" dominant-baseline="middle">分析流程</text><path d="M 968 843.0 C 1063 843.0, 1150 747, 1250 747" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="747" font-size="22" fill="#344048" dominant-baseline="middle">录入月访问量与月营业额</text><path d="M 968 843.0 C 1063 843.0, 1150 795, 1250 795" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="795" font-size="22" fill="#344048" dominant-baseline="middle">插入 → 散点图，观察关系</text><path d="M 968 843.0 C 1063 843.0, 1150 843, 1250 843" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="843" font-size="22" fill="#344048" dominant-baseline="middle">文件 → 选项 → 加载项 → 分析工具库</text><path d="M 968 843.0 C 1063 843.0, 1150 891, 1250 891" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="891" font-size="22" fill="#344048" dominant-baseline="middle">数据 → 数据分析 → 相关系数</text><path d="M 968 843.0 C 1063 843.0, 1150 939, 1250 939" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="939" font-size="22" fill="#344048" dominant-baseline="middle">选输入区域、分组方式、首行标签与输出位置</text><path d="M 776 927.0 C 871 927.0, 750 1011.0, 850 1011.0" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="865" y="1011.0" font-size="22" fill="#344048" dominant-baseline="middle">结果解读</text><path d="M 968 1011.0 C 1063 1011.0, 1150 987, 1250 987" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="987" font-size="22" fill="#344048" dominant-baseline="middle">r≈0.999835：极强的正线性相关</text><path d="M 968 1011.0 C 1063 1011.0, 1150 1035, 1250 1035" fill="none" stroke="#E7B52D" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1035" font-size="22" fill="#344048" dominant-baseline="middle">相关程度很高，本身不能证明因果关系【补充】</text><path d="M 350 1212.0 C 445 1212.0, 370 1269.0, 470 1269.0" fill="none" stroke="#88B64E" stroke-width="8" stroke-linecap="round"/><rect x="470" y="1241.0" width="260" height="56" rx="13" fill="white" stroke="#88B64E" stroke-width="2"/><text x="485" y="1269.0" font-size="23" fill="#344048" dominant-baseline="middle">回归分析：模型与含义</text><path d="M 730 1269.0 C 825 1269.0, 750 1149.0, 850 1149.0" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="865" y="1149.0" font-size="22" fill="#344048" dominant-baseline="middle">目标</text><path d="M 924 1149.0 C 1019 1149.0, 1150 1125, 1250 1125" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1125" font-size="22" fill="#344048" dominant-baseline="middle">用已知或设定的自变量值，估计因变量均值</text><path d="M 924 1149.0 C 1019 1149.0, 1150 1173, 1250 1173" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1173" font-size="22" fill="#344048" dominant-baseline="middle">在关系分析基础上建立模型，用于预测</text><path d="M 730 1269.0 C 825 1269.0, 750 1269.0, 850 1269.0" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="865" y="1269.0" font-size="22" fill="#344048" dominant-baseline="middle">一元线性模型</text><path d="M 1012 1269.0 C 1107 1269.0, 1150 1221, 1250 1221" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1221" font-size="22" fill="#344048" dominant-baseline="middle">Yᵢ＝β₀＋β₁Xᵢ＋μᵢ</text><path d="M 1012 1269.0 C 1107 1269.0, 1150 1269, 1250 1269" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1269" font-size="22" fill="#344048" dominant-baseline="middle">X：自变量；Y：因变量</text><path d="M 1012 1269.0 C 1107 1269.0, 1150 1317, 1250 1317" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1317" font-size="22" fill="#344048" dominant-baseline="middle">β₀：截距；β₁：斜率；μᵢ：随机误差</text><path d="M 730 1269.0 C 825 1269.0, 750 1389.0, 850 1389.0" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="865" y="1389.0" font-size="22" fill="#344048" dominant-baseline="middle">随机误差来源</text><path d="M 1012 1389.0 C 1107 1389.0, 1150 1365, 1250 1365" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1365" font-size="22" fill="#344048" dominant-baseline="middle">未知因素、残缺数据、众多细小因素</text><path d="M 1012 1389.0 C 1107 1389.0, 1150 1413, 1250 1413" fill="none" stroke="#88B64E" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1413" font-size="22" fill="#344048" dominant-baseline="middle">观测误差、模型设定误差、内在随机性</text><path d="M 350 1212.0 C 445 1212.0, 370 1731.0, 470 1731.0" fill="none" stroke="#DA736C" stroke-width="8" stroke-linecap="round"/><rect x="470" y="1703.0" width="260" height="56" rx="13" fill="white" stroke="#DA736C" stroke-width="2"/><text x="485" y="1731.0" font-size="23" fill="#344048" dominant-baseline="middle">回归分析：步骤与案例</text><path d="M 730 1731.0 C 825 1731.0, 750 1599.0, 850 1599.0" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="865" y="1599.0" font-size="22" fill="#344048" dominant-baseline="middle">五步流程</text><path d="M 968 1599.0 C 1063 1599.0, 1150 1503, 1250 1503" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1503" font-size="22" fill="#344048" dominant-baseline="middle">① 确定自变量与因变量</text><path d="M 968 1599.0 C 1063 1599.0, 1150 1551, 1250 1551" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1551" font-size="22" fill="#344048" dominant-baseline="middle">② 画散点图，判断模型类型</text><path d="M 968 1599.0 C 1063 1599.0, 1150 1599, 1250 1599" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1599" font-size="22" fill="#344048" dominant-baseline="middle">③ 建模，用最小二乘法估计参数</text><path d="M 968 1599.0 C 1063 1599.0, 1150 1647, 1250 1647" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1647" font-size="22" fill="#344048" dominant-baseline="middle">④ 检验模型</text><path d="M 968 1599.0 C 1063 1599.0, 1150 1695, 1250 1695" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1695" font-size="22" fill="#344048" dominant-baseline="middle">⑤ 代入模型进行预测</text><path d="M 730 1731.0 C 825 1731.0, 750 1863.0, 850 1863.0" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="865" y="1863.0" font-size="22" fill="#344048" dominant-baseline="middle">纯收入 → 消费支出</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1743, 1250 1743" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1743" font-size="22" fill="#344048" dominant-baseline="middle">X＝人均纯收入；Y＝人均消费支出</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1791, 1250 1791" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1791" font-size="22" fill="#344048" dominant-baseline="middle">课件方程：ŷ＝7.8940＋0.7374x</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1839, 1250 1839" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1839" font-size="22" fill="#344048" dominant-baseline="middle">收入增加100元，对应预测消费增加73.74元</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1887, 1250 1887" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1887" font-size="22" fill="#344048" dominant-baseline="middle">F＝214.13＞5.99（α＝0.05），线性关系显著</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1935, 1250 1935" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1935" font-size="22" fill="#344048" dominant-baseline="middle">x＝3500：按所列方程计算 ŷ≈2588.79元</text><path d="M 1100 1863.0 C 1195 1863.0, 1150 1983, 1250 1983" fill="none" stroke="#DA736C" stroke-width="2" stroke-linecap="round"/><text x="1265" y="1983" font-size="22" fill="#344048" dominant-baseline="middle">课件写2588.72元，与所列方程有小出入</text><path d="M 350 1212.0 C 445 1212.0, 370 2193.0, 470 2193.0" fill="none" stroke="#8470B5" stroke-width="8" stroke-linecap="round"/><rect x="470" y="2165.0" width="214" height="56" rx="13" fill="white" stroke="#8470B5" stroke-width="2"/><text x="485" y="2193.0" font-size="23" fill="#344048" dominant-baseline="middle">相关与回归：辨析</text><path d="M 684 2193.0 C 779 2193.0, 750 2097.0, 850 2097.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="2097.0" font-size="22" fill="#344048" dominant-baseline="middle">变量地位</text><path d="M 968 2097.0 C 1063 2097.0, 1150 2073, 1250 2073" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2073" font-size="22" fill="#344048" dominant-baseline="middle">相关：X、Y地位对称</text><path d="M 968 2097.0 C 1063 2097.0, 1150 2121, 1250 2121" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2121" font-size="22" fill="#344048" dominant-baseline="middle">回归：区分解释变量X与被解释变量Y</text><path d="M 684 2193.0 C 779 2193.0, 750 2193.0, 850 2193.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="2193.0" font-size="22" fill="#344048" dominant-baseline="middle">分析目的</text><path d="M 968 2193.0 C 1063 2193.0, 1150 2169, 1250 2169" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2169" font-size="22" fill="#344048" dominant-baseline="middle">相关：描述关系的方向与密切程度</text><path d="M 968 2193.0 C 1063 2193.0, 1150 2217, 1250 2217" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2217" font-size="22" fill="#344048" dominant-baseline="middle">回归：建立数量关系，估计与预测</text><path d="M 684 2193.0 C 779 2193.0, 750 2289.0, 850 2289.0" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="865" y="2289.0" font-size="22" fill="#344048" dominant-baseline="middle">理解边界</text><path d="M 968 2289.0 C 1063 2289.0, 1150 2265, 1250 2265" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2265" font-size="22" fill="#344048" dominant-baseline="middle">经典回归可把X视为给定；不宜泛化为X只能非随机【补充】</text><path d="M 968 2289.0 C 1063 2289.0, 1150 2313, 1250 2313" fill="none" stroke="#8470B5" stroke-width="2" stroke-linecap="round"/><text x="1265" y="2313" font-size="22" fill="#344048" dominant-baseline="middle">回归关系本身也不能自动证明因果【补充】</text><rect x="70" y="1174.0" width="280" height="76" rx="16" fill="#50B98C"/><text x="95" y="1212.0" font-size="30" fill="white" dominant-baseline="middle">复杂数据整理</text><text x="70" y="2448" font-size="17" fill="#88959A" dominant-baseline="middle">依据课程截图整理，重复内容已合并；标注“补充”的内容用于澄清概念。</text></g></svg>