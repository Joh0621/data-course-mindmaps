<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="课堂截图逐页导图与可编辑笔记"><title>课堂课程思维导图</title>
<style>
:root{--ink:#1b2940;--muted:#68758b;--line:#e4e9f1;--bg:#f4f6fa;--blue:#294a7c;--green:#50b98c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}header{background:linear-gradient(120deg,#1f3864,#315a99);color:white;padding:27px 0}.wrap{max-width:1480px;margin:auto;padding:0 20px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#c8d8f1;margin:0 0 4px}h1{font-size:27px;margin:0}header p{margin:4px 0 0;color:#d5e1f4;font-size:13px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0}.toolbar button,.toolbar label{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}.toolbar .primary{background:var(--blue);color:white;border-color:var(--blue)}.toolbar .saved{color:#267b58;margin-left:auto;font-size:12px}.layout{display:grid;grid-template-columns:220px minmax(300px,1fr) minmax(300px,430px);gap:15px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #17243b0a}.courses{padding:12px;position:sticky;top:12px}.coursebtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--ink);font-size:14px;margin:4px 0;border-left:4px solid var(--c)}.coursebtn.active{background:#f1f4f9;font-weight:700}.count{display:block;font-size:11px;color:var(--muted);font-weight:400}.root{padding:15px;margin-bottom:12px;border-radius:11px;color:white;background:var(--c);font-weight:700}.branches{padding:4px 5px 10px 15px;border-left:3px solid var(--c);margin-left:10px}.node{position:relative;padding:10px 12px 10px 15px;border:1px solid var(--line);border-left:3px solid var(--c);border-radius:9px;margin:8px 0;background:white;cursor:pointer}.node:before{content:"";position:absolute;left:-16px;top:21px;width:13px;border-top:2px solid var(--c)}.node.active{outline:2px solid color-mix(in srgb,var(--c),white 45%);background:#fbfcff}.node-title{font-size:13px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.node-meta{font-size:10px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.editor{padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.editor h2{font-size:15px;margin:0 0 13px}.editor label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}.editor input,.editor textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:13px;color:var(--ink);background:#fff}.editor textarea{min-height:180px;resize:vertical;white-space:pre-wrap}.editor .controls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editor .controls button{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;cursor:pointer;font-size:12px}.figures img{display:block;width:100%;height:auto;margin:12px 0;border:1px solid var(--line);border-radius:7px;cursor:zoom-in}.hint{font-size:11px;color:var(--muted)}.empty{color:var(--muted);padding:25px}.file-input{display:none}@media(max-width:1050px){.layout{grid-template-columns:190px minmax(250px,1fr)}.editor{position:static;grid-column:1/-1;max-height:none}}@media(max-width:600px){.wrap{padding:0 11px}header{padding:22px 0}.layout{grid-template-columns:1fr}.courses{position:static;display:flex;overflow:auto;gap:4px}.coursebtn{min-width:155px}.editor{grid-column:auto}.toolbar .saved{margin-left:0}}
</style></head><body><header><div class="wrap"><p class="eyebrow">CLASS NOTES · 2026.10.28</p><h1>课堂课程思维导图</h1><p>按截图逐页整理 · 原课件文字可编辑 · 图表以裁切的课件图像呈现</p></div></header>
<main class="wrap"><div class="toolbar"><button class="primary" id="save">保存到此浏览器</button><button id="export">导出可编辑 JSON</button><button id="export-mm">导出 FreeMind 文件</button><label for="import">导入 JSON</label><input class="file-input" id="import" type="file" accept="application/json"><button id="reset">恢复原始整理</button><span class="saved" id="status">载入中…</span></div><div class="layout"><nav class="panel courses" id="courses"></nav><section class="panel map" id="map"></section><aside class="panel editor" id="editor"><div class="empty">选择左侧节点查看和编辑内容。</div></aside></div><p class="hint">编辑会自动保存在当前浏览器。导出 JSON 可备份或在另一台设备导入；FreeMind 文件可用兼容思维导图软件继续编辑。原图截取仅用于图表节点。</p></main>
<script>
const KEY='class-mindmap-edits-v2';let original,model,activeCourse=1,activeSlide=null,dirty=false;const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(t){$('#status').textContent=t}function persist(){localStorage.setItem(KEY,JSON.stringify(model));dirty=false;setStatus('已保存在此浏览器')}
function course(){return model.courses.find(x=>x.id===activeCourse)}function slides(){return model.slides.filter(x=>x.course===activeCourse)}
function render(){renderCourses();renderMap();renderEditor()}
function renderCourses(){const nav=$('#courses');nav.innerHTML=model.courses.map(c=>`<button class="coursebtn ${c.id===activeCourse?'active':''}" style="--c:${esc(c.color)}" data-course="${c.id}">${esc(c.title)}<span class="count">${model.slides.filter(s=>s.course===c.id).length} 页</span></button>`).join('');nav.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{activeCourse=Number(b.dataset.course);activeSlide=null;render()})}
function renderMap(){const c=course(),list=slides();$('#map').innerHTML=`<div style="--c:${esc(c.color)};padding:15px"><div class="root">${esc(c.title)}</div><div class="branches">${list.map(s=>`<article class="node ${s.id===activeSlide?'active':''}" style="--c:${esc(c.color)}" data-slide="${esc(s.id)}"><div class="node-title">${esc(s.title||'（空白节点）')}</div><div class="node-meta">${esc(s.source||'手工笔记')}${s.figures?.length?' · 含图表':''}</div></article>`).join('')||'<div class="empty">此课程还没有节点，点右侧“新增子节点”开始记录。</div>'}</div></div>`;$('#map').querySelectorAll('[data-slide]').forEach(n=>n.onclick=()=>{activeSlide=n.dataset.slide;renderMap();renderEditor()})}
function renderEditor(){const box=$('#editor'),s=model.slides.find(x=>x.id===activeSlide);if(!s){box.innerHTML=`<h2>${esc(course().title)}</h2><p class="hint">选择一个截图节点查看文字，或在此课程下新增笔记。</p><button class="primary" id="add-first">新增子节点</button>`;$('#add-first').onclick=()=>addNode();return}
box.innerHTML=`<h2>编辑节点</h2><label for="title">节点标题</label><input id="title" value="${esc(s.title)}"><label for="body">截图文字 / 笔记</label><textarea id="body">${esc(s.body||'')}</textarea><div class="controls"><button id="add">新增子节点</button><button id="up">上移</button><button id="down">下移</button><button id="delete">删除节点</button></div>${s.figures?.length?`<div class="figures">${s.figures.map(p=>`<img src="${esc(p)}" alt="课件图表截图，点击查看原裁图" title="点击放大" onclick="window.open(this.src,'_blank')">`).join('')}</div>`:''}<div class="hint">来源截图：${esc(s.source||'手工添加')}</div>`;
$('#title').oninput=e=>{s.title=e.target.value;dirty=true;setStatus('有未保存的修改');renderMap()};$('#body').oninput=e=>{s.body=e.target.value;dirty=true;setStatus('有未保存的修改')};$('#add').onclick=()=>addNode(s);$('#delete').onclick=()=>{if(confirm('删除此节点？')){model.slides=model.slides.filter(x=>x.id!==s.id);activeSlide=null;persist();render()}};$('#up').onclick=()=>move(s,-1);$('#down').onclick=()=>move(s,1)}
function addNode(after){const same=slides();const ix=after?same.findIndex(s=>s.id===after.id)+1:same.length;const n={id:'note-'+Date.now(),course:activeCourse,title:'新笔记',body:'',source:'手工笔记'};const globalIx=model.slides.findIndex(s=>s.course===activeCourse&&s.id===(same[ix]?.id));if(globalIx<0)model.slides.push(n);else model.slides.splice(globalIx,0,n);activeSlide=n.id;dirty=true;setStatus('有未保存的修改');render()}
function move(s,delta){const arr=slides(),i=arr.findIndex(x=>x.id===s.id),j=i+delta;if(j<0||j>=arr.length)return;const other=arr[j],a=model.slides.indexOf(s),b=model.slides.indexOf(other);model.slides[a]=other;model.slides[b]=s;dirty=true;render()}
$('#save').onclick=persist;$('#export').onclick=()=>download('课程思维导图-可编辑.json',JSON.stringify(model,null,2),'application/json');$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.courses)||!Array.isArray(d.slides))throw Error('格式不正确');model=d;activeCourse=model.courses[0].id;activeSlide=null;persist();render()}catch(err){alert('导入失败：'+err.message)}e.target.value=''};$('#reset').onclick=()=>{if(confirm('恢复到根据原始截图提取的初始内容？此操作会清除当前浏览器的编辑。')){model=structuredClone(original);activeCourse=model.courses[0].id;activeSlide=null;persist();render()}};
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function xml(n){return `<node TEXT="${esc(n.title).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${n.body?`<node TEXT="${esc(n.body.slice(0,500)).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"/>`:''}${n.children||''}</node>`}$('#export-mm').onclick=()=>{const nodes=model.courses.map(c=>`<node TEXT="${esc(c.title).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${model.slides.filter(s=>s.course===c.id).map(s=>`<node TEXT="${esc(s.title).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"><node TEXT="${esc((s.body||'').slice(0,500)).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"/></node>`).join('')}</node>`).join('');download('课堂课程思维导图.mm',`<?xml version="1.0" encoding="UTF-8"?><map version="1.0.1"><node TEXT="课堂课程思维导图">${nodes}</node></map>`,'application/xml')};
(async()=>{const d=await fetch('slides-data.json').then(r=>r.json());original=d;model=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(original);activeCourse=model.courses[0].id;persist();render()})().catch(e=>setStatus('载入失败：'+e.message));
</script></body></html>
